name: Проверка и выкладка сайта

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Вернуть сайт на версию № (номер из журнала выкладок)"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

# выкладки идут строго по очереди, ни одна не обрывается на середине
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TZ: Europe/Moscow
  SITE_URL: https://yoririkunagi.github.io/site-autodeploy
  KEEP_RELEASES: 30

jobs:
  check:
    name: Проверка кода
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: ./scripts/check-site.sh site

  deploy:
    name: Резервная копия и выкладка
    needs: check
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.check.result == 'success'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Достаём архив версий
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin backups >/dev/null; then
            git fetch origin backups:backups
            git worktree add backups backups
          else
            git worktree add --orphan -b backups backups
          fi

      - name: Сохраняем новую версию в архив
        id: rel
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          MESSAGE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          SHA: ${{ github.sha }}
        run: |
          ./scripts/release.sh new | tee -a "$GITHUB_OUTPUT"
          REPO=${{ github.repository }} ./scripts/release.sh build "$(grep '^id=' $GITHUB_OUTPUT | tail -1 | cut -d= -f2)" _out

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _out
          name: release-${{ steps.rel.outputs.id }}

      - name: Выкладываем на сайт
        uses: actions/deploy-pages@v4
        with:
          artifact_name: release-${{ steps.rel.outputs.id }}

      - name: Проверяем живой сайт
        id: smoke
        run: ./scripts/smoke.sh "$SITE_URL" "${{ steps.rel.outputs.id }}"

      - name: Всё в порядке — отмечаем версию как текущую
        if: success()
        run: ./scripts/release.sh status "${{ steps.rel.outputs.id }}" live

      # ---- если живой сайт не прошёл проверку, возвращаем прошлую версию ----
      - name: Сайт не прошёл проверку — готовим прошлую версию
        id: back
        if: failure() && steps.smoke.outcome == 'failure' && steps.rel.outputs.prev != ''
        run: |
          ./scripts/release.sh status "${{ steps.rel.outputs.id }}" failed
          REPO=${{ github.repository }} ./scripts/release.sh build "${{ steps.rel.outputs.prev }}" _back
          echo "::warning::Версия №${{ steps.rel.outputs.id }} сломала сайт. Возвращаем №${{ steps.rel.outputs.prev }}"

      - uses: actions/upload-pages-artifact@v4
        if: failure() && steps.back.outcome == 'success'
        with:
          path: _back
          name: back-${{ steps.rel.outputs.prev }}

      - name: Возвращаем прошлую версию
        if: failure() && steps.back.outcome == 'success'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: back-${{ steps.rel.outputs.prev }}

      - name: Записываем архив версий
        if: always() && steps.rel.outcome == 'success'
        run: |
          ./scripts/release.sh prune "$KEEP_RELEASES"
          cd backups
          git add -A
          git commit -q -m "Версия №${{ steps.rel.outputs.id }}" || true
          git push origin backups
